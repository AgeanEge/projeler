<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota | YKS Takip Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#232C3D;
  --ink-soft:#4A5568;
  --paper:#F7F6F0;
  --paper-line:#E4E1D4;
  --card:#FFFFFF;
  --amber:#E2A63B;
  --amber-deep:#C98A1E;
  --line:#DAD6C7;
  --shadow: 0 1px 2px rgba(35,44,61,.06), 0 4px 14px rgba(35,44,61,.06);

  --turkce:#D64550;
  --matematik:#3D5A80;
  --geometri:#5C7AA0;
  --fizik:#6B5B95;
  --kimya:#4C8C67;
  --biyoloji:#2F9C95;
  --tarih:#E08E3E;
  --cografya:#B08968;
  --felsefe:#8E6C88;
  --din:#A6763D;
  --sinavtyt:#1F3550;
  --sinavayt:#7A4B6B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(90deg, transparent 39px, var(--paper-line) 40px, transparent 41px) 0 0/40px 40px,
    linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 28px,
    var(--paper);
  background-attachment: fixed;
  color:var(--ink);
  font-family:'Space Grotesk', sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces', serif;}
.mono{font-family:'IBM Plex Mono', monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--amber); color:#fff;}

/* ---------- LOGIN SCREEN ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.ticket{
  width:100%; max-width:420px; background:var(--card); border-radius:18px;
  box-shadow:var(--shadow); padding:38px 34px 30px; position:relative;
  border:1px solid var(--line);
}
.ticket::before, .ticket::after{
  content:""; position:absolute; width:26px; height:26px; background:var(--paper);
  border-radius:50%; top:50%; transform:translateY(-50%); border:1px solid var(--line);
}
.ticket::before{left:-14px;} .ticket::after{right:-14px;}
.ticket-perf{
  border-top:2px dashed var(--line); margin:22px 0;
}
.brandmark{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.brandmark .dot{width:12px;height:12px;border-radius:50%;background:var(--amber);}
.brand-name{font-family:'Fraunces',serif; font-weight:700; font-size:22px; letter-spacing:.2px;}
.brand-sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:0;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.3px; text-transform:uppercase;}
.field input, .field select{
  width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line);
  background:#FCFBF7; font-size:15px; font-family:inherit; color:var(--ink);
}
.field input:focus, .field select:focus{outline:none; border-color:var(--amber);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:10px; border:none; font-weight:600; font-size:14.5px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn-primary{background:var(--ink); color:#fff; width:100%;}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(35,44,61,.25);}
.btn-amber{background:var(--amber); color:#fff;}
.btn-amber:hover{background:var(--amber-deep);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);}
.switch-row{text-align:center; margin-top:16px; font-size:13.5px; color:var(--ink-soft);}
.switch-row span{color:var(--amber-deep); font-weight:600; cursor:pointer;}
.err{color:var(--turkce); font-size:13px; margin-top:-6px; margin-bottom:10px; min-height:16px;}

/* ---------- APP SHELL ---------- */
#appScreen{display:none; min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:230px; flex-shrink:0; background:var(--ink); color:#EDEBE0; position:relative;
  padding:26px 0 18px;
}
.sidebar::before{
  content:""; position:absolute; left:14px; top:0; bottom:0; width:1px;
  background-image: radial-gradient(circle, #EDEBE022 2px, transparent 2px);
  background-size: 100% 26px;
}
.side-brand{padding:0 22px 22px; border-bottom:1px solid #ffffff17;}
.side-brand .brand-name{color:#fff;}
.side-brand .brand-sub{color:#B9B6A7; font-size:12px;}
.nav{padding:14px 10px;}
.nav button{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none;
  color:#CFCCBE; padding:11px 14px; border-radius:9px; font-size:14.5px; margin-bottom:2px; font-weight:500;
}
.nav button .ic{width:18px; text-align:center; opacity:.85;}
.nav button:hover{background:#ffffff0d; color:#fff;}
.nav button.active{background:var(--amber); color:#fff;}
.side-foot{padding:14px 22px 0; border-top:1px solid #ffffff17; margin-top:12px;}
.side-foot button{width:100%;}

.main{flex:1; padding:30px 34px 60px; max-width:1180px;}
.topline{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
.page-title{font-size:26px; font-weight:700; margin:0;}
.page-sub{color:var(--ink-soft); font-size:14px; margin-top:4px;}
.today-chip{font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--card); border:1px solid var(--line); padding:7px 12px; border-radius:20px; box-shadow:var(--shadow);}

.grid{display:grid; gap:18px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; box-shadow:var(--shadow);}
.card h3{margin:0 0 4px; font-size:15px;}
.card .eyebrow{font-size:11.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--amber-deep); font-weight:600; margin-bottom:6px;}
.card-tight{padding:16px 18px;}

/* countdown hero */
.hero-ticket{
  background:var(--ink); color:#fff; border-radius:18px; padding:26px 28px; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.hero-ticket::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:var(--amber); opacity:.18;}
.hero-left .eyebrow{color:#D9CBA0;}
.hero-num{font-family:'IBM Plex Mono',monospace; font-size:58px; font-weight:600; line-height:1; color:var(--amber);}
.hero-num small{font-size:16px; font-weight:500; color:#fff; margin-left:6px;}
.hero-right{display:flex; gap:22px; flex-wrap:wrap;}
.hero-stat{text-align:center;}
.hero-stat b{display:block; font-family:'IBM Plex Mono',monospace; font-size:22px; color:#fff;}
.hero-stat span{font-size:11.5px; color:#B9B6A7; text-transform:uppercase; letter-spacing:.4px;}

.progress-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.progress-row .lbl{width:98px; font-size:13px; flex-shrink:0;}
.progress-track{flex:1; height:9px; background:var(--paper); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; border-radius:6px;}
.progress-pct{width:38px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);}

.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600;}
.chip-dot{width:8px;height:8px;border-radius:50%;}

.tag-input-row{display:flex; gap:8px; margin-top:10px;}
.tag-input-row input, .tag-input-row select{flex:1;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); padding:8px 10px; border-bottom:1.5px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--paper-line);}
tr:last-child td{border-bottom:none;}

.list-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--paper-line);}
.list-item:last-child{border-bottom:none;}

.empty-state{text-align:center; padding:34px 10px; color:var(--ink-soft);}
.empty-state .glyph{font-size:30px; margin-bottom:8px;}

.modal-bg{display:none; position:fixed; inset:0; background:rgba(35,44,61,.45); z-index:50; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--card); border-radius:16px; padding:24px 26px; width:100%; max-width:480px; max-height:86vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{margin-top:0;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}

.tabbar{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
.tabbar button{background:var(--card); border:1px solid var(--line); padding:8px 14px; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--ink-soft);}
.tabbar button.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.subject-ring{display:flex; flex-direction:column; align-items:center; gap:6px;}
.subject-ring span{font-size:12px; text-align:center; font-weight:600;}
.subject-ring small{font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:11px;}

.timer-display{font-family:'IBM Plex Mono',monospace; font-size:44px; text-align:center; letter-spacing:1px; margin:6px 0 14px;}
.icon-btn{background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:6px 10px; font-size:13px;}
.icon-btn:hover{border-color:var(--ink-soft);}

.note-card{border-left:4px solid var(--amber); background:var(--card); border-radius:0 12px 12px 0; padding:14px 16px; margin-bottom:12px; border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line);}
.note-meta{font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; display:flex; gap:8px; align-items:center;}

.week-grid{display:grid; grid-template-columns:70px repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.week-grid > div{background:var(--card); padding:8px 6px; font-size:11.5px; min-height:46px;}
.week-grid .hdr{background:var(--ink); color:#fff; text-align:center; font-weight:600; padding:9px 4px;}
.week-cell{cursor:pointer; position:relative;}
.week-cell:hover{background:#FBF6E8;}
.week-cell .tagline{display:block; padding:2px 5px; border-radius:5px; margin-bottom:2px; font-size:10.5px; color:#fff; font-weight:600;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:10px; font-size:13.5px; box-shadow:0 10px 24px rgba(0,0,0,.3); z-index:80; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.small-x{background:none; border:none; color:var(--ink-soft); font-size:15px; padding:2px 6px;}
.small-x:hover{color:var(--turkce);}

@media(max-width:820px){
  .shell{flex-direction:column;}
  .sidebar{width:100%; padding:14px 0;}
  .nav{display:flex; overflow-x:auto; gap:2px; padding:10px;}
  .nav button{white-space:nowrap;}
  .side-foot{display:none;}
  .main{padding:20px 16px 50px;}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="ticket">
    <div class="brandmark"><div class="dot"></div><div class="brand-name">Rota</div></div>
    <p class="brand-sub" id="loginSubtitle">YKS'ye giden yolda karnen, planın ve netlerin — tek defterde.</p>
    <div class="ticket-perf"></div>

    <div id="loginForm">
      <div class="field"><label>Kullanıcı adı</label><input id="li_user" placeholder="ör. ayse2027"></div>
      <div class="field"><label>Şifre</label><input id="li_pass" type="password" placeholder="••••••••"></div>
      <div class="err" id="li_err"></div>
      <button class="btn btn-primary" onclick="doLogin()">Giriş yap</button>
      <div class="switch-row">Hesabın yok mu? <span onclick="toggleAuth(false)">Hesap oluştur</span></div>
    </div>

    <div id="registerForm" style="display:none;">
      <div class="field"><label>Adın</label><input id="rg_name" placeholder="ör. Ayşe"></div>
      <div class="field"><label>Kullanıcı adı</label><input id="rg_user" placeholder="Kullanıcı adı belirle"></div>
      <div class="field"><label>Şifre</label><input id="rg_pass" type="password" placeholder="Şifre belirle"></div>
      <div class="field"><label>Hedefin</label>
        <select id="rg_track">
          <option value="sayisal">Sayısal</option>
          <option value="ea">Eşit Ağırlık</option>
          <option value="sozel">Sözel</option>
        </select>
      </div>
      <div class="err" id="rg_err"></div>
      <button class="btn btn-primary" onclick="doRegister()">Hesabı oluştur ve başla</button>
      <div class="switch-row">Zaten hesabın var mı? <span onclick="toggleAuth(true)">Giriş yap</span></div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appScreen">
  <div class="shell">
    <div class="sidebar">
      <div class="side-brand">
        <div class="brandmark"><div class="dot"></div><div class="brand-name">Rota</div></div>
        <div class="brand-sub" id="sideUserline">öğrenci</div>
      </div>
      <div class="nav" id="navList"></div>
      <div class="side-foot">
        <button class="btn btn-ghost" onclick="logout()">Çıkış yap</button>
      </div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ROTA — YKS Takip Defteri

   ============================================================ */

const SUBJECTS = {

  ayt_tarih1:{name:'Tarih-1', color:'var(--tarih)', group:'ayt_ea,ayt_sozel'},
  ayt_cografya1:{name:'Coğrafya-1', color:'var(--cografya)', group:'ayt_ea,ayt_sozel'},

const DEFAULT_TOPICS = {

  din:['İnanç','İbadet','Ahlak ve Değerler','Din ve Hayat','Din, Kültür ve Medeniyet'],
  ayt_mat:['Fonksiyonlarda İleri Konular','Türev','İntegral','Trigonometri','Analitik Geometri (İleri)','Karmaşık Sayılar','Diziler','Logaritma'],
  ayt_fizik:['Vektörler','Elektrik ve Manyetizma','Dalgalar','Modern Fizik','Atom Fiziğine Giriş','Çembersel Hareket'],

  edebiyat:['Anlam Bilgisi (İleri)','Şiir Bilgisi','Edebi Sanatlar','Türk Edebiyatı Dönemleri','Batı Etkisinde Türk Edebiyatı','Cumhuriyet Dönemi Türk Edebiyatı'],
  ayt_tarih1:['İnkılap Tarihi ve Atatürkçülük','20.yy Başlarında Osmanlı','Milli Mücadele','Atatürk İlkeleri'],
  ayt_cografya1:['Ekosistem ve Madde Döngüsü','Nüfus Politikaları','Şehirleşme','Türkiye Ekonomisi'],
  ayt_tarih2:['Dünya Gücü Osmanlı','Değişim Çağında Osmanlı','En Uzun Yüzyıl','Milli Mücadele ve Sonrası'],
  ayt_cografya2:['Bölgeler ve Ülkeler','Küresel Ortam: Bölgeler ve Ülkeler','Çevre ve Toplum','Doğal Afetler'],
  ayt_felsefegrp:['Psikoloji Bilimini Tanıma','Sosyolojiye Giriş','Mantık İlkeleri'],
  ayt_dindeg:['İslam Düşüncesinde Yorumlar','Güncel Dini Meseleler','İslam ve Bilim'],
};

const DAYS = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const SLOT_LABELS = ['08-10','10-12','13-15','15-17','17-19','19-21','21-23'];
const MONTH_NAMES = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function aytCore(track){
  if(track==='sayisal') return ['ayt_mat','ayt_fizik','ayt_kimya','ayt_biyoloji'];
  if(track==='ea') return ['ayt_mat','edebiyat','ayt_tarih1','ayt_cografya1'];
  return ['edebiyat','ayt_tarih1','ayt_cografya1','ayt_felsefegrp'];
}

/* Ready-made programs, grounded in commonly-recommended YKS study patterns:
   45-90 min focused blocks, TYT/AYT rotation, weekly full mock exam + analysis,
   a rest day, and morning sessions aligned with the real 10:15 TYT/AYT start time. */
const TEMPLATES = {

function saveSessionToken(token){ try{ localStorage.setItem('rota_session_token', token); }catch(e){} }

/* ---------------- storage helpers ----------------
   Primary: Supabase, via get_data/set_data RPC functions scoped to the
   current session token (validated server-side on every call).
   Fallback: browser localStorage, only used if Supabase is unreachable. */
async function sget(key){
  if(sb && STATE.sessionToken){
    try{
      const { data, error } = await sb.rpc('get_data', { p_token: STATE.sessionToken, p_key: key });
      if(!error) return data;
    }catch(e){ /* fall through to local */ }
  }
  try{ const raw = localStorage.getItem('rota_'+key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function sset(key, val){
  if(sb && STATE.sessionToken){
    try{
      await sb.rpc('set_data', { p_token: STATE.sessionToken, p_key: key, p_value: val });
    }catch(e){ console.error('set_data failed', e); }
  }
  try{ localStorage.setItem('rota_'+key, JSON.stringify(val)); }
  catch(e){ /* ignore */ }
}

}

  let target = new Date(y, 5, 21);
  if(now > target) target = new Date(y+1, 5, 21);
  return target.toISOString().slice(0,10);
}

function sumMinutes(filterFn){ return STATE.studyLog.filter(filterFn).reduce((a,l)=>a+l.minutes,0); }
function startOfWeekISO(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function monthKey(y,m){ return y+'-'+String(m+1).padStart(2,'0'); }
function heatColor(minutes){
  if(!minutes) return '#F7F6F0';
  const capped = Math.min(minutes,240);
  const t = capped/240;
  const light = 90 - t*68;
  return `hsl(142,45%,${light}%)`;
}
function getActivityDateSet(){
  const s = new Set();
  STATE.studyLog.forEach(l=>s.add(l.date));
  STATE.exams.forEach(e=>s.add(e.date));
  STATE.notes.forEach(n=>s.add(n.date));
  Object.values(STATE.topics).forEach(list=> (list||[]).forEach(t=>{ if(t.done && t.doneAt) s.add(t.doneAt); }));
  return s;
}
function isoOf(d){ return d.toISOString().slice(0,10); }
function currentStreak(){
  const dates = getActivityDateSet();
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  if(!dates.has(isoOf(cursor))) cursor.setDate(cursor.getDate()-1);
  let streak=0;
  while(dates.has(isoOf(cursor))){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}
function last14Days(){
  const dates = getActivityDateSet();
  const arr=[];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    arr.push({date:d, active:dates.has(isoOf(d))});
  }
  return arr;
}
function mostProductiveDay(){
  const byDow = [0,0,0,0,0,0,0];
  STATE.studyLog.forEach(l=>{ const d = new Date(l.date); const idx=(d.getDay()+6)%7; byDow[idx]+=l.minutes; });
  let maxI=0; for(let i=1;i<7;i++) if(byDow[i]>byDow[maxI]) maxI=i;
  return {day:DAYS[maxI], minutes:byDow[maxI]};
}

/* ---------------- SHARED WIDGETS ---------------- */
function progressBar(label, pct, color){
  return `<div class="progress-row">
    <div class="lbl">${label}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${color};"></div></div>
    <div class="progress-pct">%${Math.round(pct)}</div>
  </div>`;
}
function ring(pct, color, size=70){
  const r = size/2 - 6; const c = 2*Math.PI*r;
  const off = c * (1 - pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--paper-line)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="53%" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="var(--ink)" font-weight="600">%${Math.round(pct)}</text>
  </svg>`;
}
function topicPct(subj){
  const list = STATE.topics[subj] || [];
  if(!list.length) return 0;
  return (list.filter(t=>t.done).length / list.length) * 100;
}
function overallTytPct(){
  const subs = tytSubjects().map(([k])=>k);

  const done = subs.reduce((a,k)=> a + (STATE.topics[k]?.filter(t=>t.done).length||0), 0);
  return total? (done/total*100):0;
}

STATE._analysisTab = 'TYT';
function renderAnalysis(){
  const list = STATE.exams.filter(e=>e.type===STATE._analysisTab).sort((a,b)=> new Date(a.date)-new Date(b.date));
  const subs = STATE._analysisTab==='TYT' ? tytSubjects() : aytSubjects();
  const latest = list[list.length-1];

  let trendHtml = '';
  if(list.length>=2){
    const half = Math.ceil(list.length/2);
    const firstHalf = list.slice(0, half);
    const secondHalf = list.slice(half).length? list.slice(half) : firstHalf;
    const avgFirst = firstHalf.reduce((a,e)=>a+examNet(e),0)/firstHalf.length;
    const avgSecond = secondHalf.reduce((a,e)=>a+examNet(e),0)/secondHalf.length;
    const diff = avgSecond-avgFirst;
    trendHtml = `<div class="card" style="margin-bottom:18px;">
      <div class="eyebrow">Gelişim</div>
      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <div style="font-family:'IBM Plex Mono'; font-size:32px; font-weight:600; color:${diff>=0?'var(--biyoloji)':'var(--turkce)'};">${diff>=0?'+':''}${diff.toFixed(1)}</div>
        <div style="font-size:13px; color:var(--ink-soft); max-width:420px;">İlk ${firstHalf.length} denemenin net ortalaması <b class="mono">${avgFirst.toFixed(1)}</b> iken, son ${secondHalf.length} denemende ortalaman <b class="mono">${avgSecond.toFixed(1)}</b> net oldu.</div>
      </div>
    </div>`;
  }

  let breakdownHtml = '';
  if(latest){
    const withData = subs.filter(([k])=>latest.subjects?.[k]);
    breakdownHtml = `<div class="card" style="margin-top:18px;">
      <div class="eyebrow">Son Deneme (${fmtDate(latest.date)}) · Doğru / Yanlış / Boş Dağılımı</div>
      ${withData.length? withData.map(([k,s])=>{
        const d = latest.subjects[k];
        const tot = (d.dogru+d.yanlis+d.bos) || 1;
        return `<div style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><span>${s.name}</span><span class="mono" style="color:var(--ink-soft);">D:${d.dogru} · Y:${d.yanlis} · B:${d.bos}</span></div>
          <div style="display:flex; height:10px; border-radius:6px; overflow:hidden; border:1px solid var(--line);">
            <div style="width:${d.dogru/tot*100}%; background:var(--biyoloji);"></div>
            <div style="width:${d.yanlis/tot*100}%; background:var(--turkce);"></div>
            <div style="width:${d.bos/tot*100}%; background:var(--paper-line);"></div>
          </div>
        </div>`;
      }).join('') : '<div class="empty-state">Bu deneme için ders verisi yok.</div>'}
    </div>`;
  }

  document.getElementById('mainArea').innerHTML = `
    <div class="topline"><div><h1 class="page-title">Analiz</h1><div class="page-sub">Net trendin, gelişimin ve derslerdeki güçlü / zayıf yönlerin.</div></div></div>
    <div class="tabbar">
      <button class="${STATE._analysisTab==='TYT'?'active':''}" onclick="STATE._analysisTab='TYT'; renderAnalysis();">TYT</button>
      <button class="${STATE._analysisTab==='AYT'?'active':''}" onclick="STATE._analysisTab='AYT'; renderAnalysis();">AYT</button>
    </div>
    ${trendHtml}
    <div class="card" style="margin-bottom:18px;">
      <div class="eyebrow">Toplam Net Trendi</div>
      ${list.length>=1 ? lineChart(list.map(e=>({x:fmtShort(e.date), y:examNet(e)}))) : `<div class="empty-state"><div class="glyph">∿</div>Trend görmek için en az 2 deneme ekle.</div>`}
    </div>
    <div class="card">
      <div class="eyebrow">Derslere Göre Ortalama Net</div>
      ${list.length? subjectAvgBars(list, subs) : `<div class="empty-state">Henüz veri yok.</div>`}
    </div>
    ${breakdownHtml}
  `;
}
function fmtShort(d){ const dt=new Date(d); return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}); }
function lineChart(points){
  if(points.length===1) points = [{x:'',y:0}, ...points];
  const w=760,h=200,pad=34;
  const maxY = Math.max(...points.map(p=>p.y), 1) * 1.15;
  const stepX = (w-pad*2)/(points.length-1||1);
  const coords = points.map((p,i)=> [pad+i*stepX, h-pad-(p.y/maxY)*(h-pad*1.6)]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area = path + ` L${coords[coords.length-1][0]},${h-pad} L${coords[0][0]},${h-pad} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:200px;">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--amber)" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="var(--amber-deep)" stroke-width="2.5"/>
    ${coords.map((c,i)=>`<circle cx="${c[0]}" cy="${c[1]}" r="3.5" fill="var(--amber-deep)"/><text x="${c[0]}" y="${h-10}" font-size="9.5" fill="var(--ink-soft)" text-anchor="middle" font-family="IBM Plex Mono">${points[i].x}</text><text x="${c[0]}" y="${c[1]-8}" font-size="10" fill="var(--ink)" text-anchor="middle" font-family="IBM Plex Mono">${points[i].y.toFixed(1)}</text>`).join('')}
  </svg>`;
}
function subjectAvgBars(list, subs){
  return subs.map(([k,s])=>{
    const vals = list.map(e=> e.subjects?.[k]?.net).filter(v=>v!==undefined);
    if(!vals.length) return '';
    const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
    const maxPossible = 40;
    return progressBar(s.name, Math.min(100, avg/maxPossible*100), s.color) ;
  }).join('') || '<div class="empty-state">Henüz veri yok.</div>';
}

function renderScheduleMonth(){
  const cal = STATE._scheduleCal;
  const first = new Date(cal.y, cal.m, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(cal.y, cal.m+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const key = monthKey(cal.y, cal.m);
  const goals = STATE.monthlyGoals[key] || [];
  const todayStr = todayISO();

  return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <button class="icon-btn" onclick="shiftScheduleMonth(-1)">←</button>
        <h3 style="margin:0;">${MONTH_NAMES[cal.m]} ${cal.y}</h3>
        <button class="icon-btn" onclick="shiftScheduleMonth(1)">→</button>
      </div>
      <div class="week-grid" style="grid-template-columns:repeat(7,1fr);">
        ${DAYS.map(d=>`<div class="hdr">${d}</div>`).join('')}
        ${cells.map(d=>{
          if(!d) return `<div></div>`;
          const dateObj = new Date(cal.y, cal.m, d);
          const dk = DAY_KEYS[(dateObj.getDay()+6)%7];
          const subs = [...new Set((STATE.schedule[dk]||[]).map(it=>it.subject))];
          const iso = dateObj.toISOString().slice(0,10);
          const isToday = iso===todayStr;
          return `<div style="${isToday? 'outline:2px solid var(--amber); outline-offset:-2px;':''}">
            <div class="mono" style="font-size:11px; font-weight:600; margin-bottom:4px;">${d}</div>
            <div style="display:flex; flex-wrap:wrap; gap:2px;">${subs.slice(0,6).map(s=>`<span style="width:7px;height:7px;border-radius:50%;background:${SUBJECTS[s]?.color||'#999'};display:inline-block;"></span>`).join('')}</div>
          </div>`;
        }).join('')}

  try{

    const context = `Öğrenci hedefi: ${trackLabel(STATE.settings.track)}. YKS'ye kalan gün: ${daysLeft()}. Son TYT net: ${lastTyt?examNet(lastTyt).toFixed(1):'yok'}. Son AYT net: ${lastAyt?examNet(lastAyt).toFixed(1):'yok'}. Mevcut haftalık programı (JSON): ${JSON.stringify(STATE.schedule).slice(0,500)}`;

}

function fmtTimer(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;

}

      STATE.timer.seconds++;
      const disp = document.getElementById('timerDisplay');
      if(disp) disp.textContent = fmtTimer(STATE.timer.seconds);
    }, 1000);
  } else {
    clearInterval(STATE.timer.interval);
  }
  renderStudy();
}
async function timerStop(){
  clearInterval(STATE.timer.interval);
  const minutes = Math.round(STATE.timer.seconds/60);
  if(minutes>0){
    STATE.studyLog.push({id:uid(), date:todayISO(), subject:STATE.timer.subject, minutes});

    toast(minutes+' dakika kaydedildi ✓');

  STATE.timer.running=false; STATE.timer.seconds=0;
  renderStudy();
}

        <button class="btn btn-amber" onclick="startExamTimer('AYT')">AYT Başlat (180 dk)</button>
      ` : `
        <span class="pill" style="background:${et.type==='TYT'?'var(--sinavtyt)':'var(--sinavayt)'}22; color:${et.type==='TYT'?'var(--sinavtyt)':'var(--sinavayt)'};">${et.type} Denemesi</span>

      `}

function refreshExamTimerCard(){
  const el = document.getElementById('examTimerCard');
  if(el) el.innerHTML = renderExamTimerCard();
}
function startExamTimer(type){
  const total = type==='TYT'? 165*60 : 180*60;
  clearInterval(STATE.examTimer.interval);
  STATE.examTimer = {running:true, type, remaining: total, total, interval:null};
  STATE.examTimer.interval = setInterval(()=>{
    STATE.examTimer.remaining--;
    const disp = document.querySelector('#examTimerCard .timer-display');
    if(disp) disp.textContent = fmtTimer(STATE.examTimer.remaining);
    if(STATE.examTimer.remaining<=0){ stopExamTimer(true); }
  }, 1000);
  refreshExamTimerCard();
}
function toggleExamTimer(){
  const et = STATE.examTimer;
  et.running = !et.running;
  if(et.running){
    et.interval = setInterval(()=>{
      et.remaining--;
      const disp = document.querySelector('#examTimerCard .timer-display');
      if(disp) disp.textContent = fmtTimer(et.remaining);
      if(et.remaining<=0) stopExamTimer(true);
    },1000);
  } else clearInterval(et.interval);
  refreshExamTimerCard();
}
async function stopExamTimer(logIt){
  const et = STATE.examTimer;
  clearInterval(et.interval);
  if(logIt && et.type){
    const elapsedMin = Math.round((et.total - et.remaining)/60);
    if(elapsedMin>0){
      STATE.studyLog.push({id:uid(), date:todayISO(), subject: et.type==='TYT'?'sinav_tyt':'sinav_ayt', minutes: elapsedMin});
      await saveStudyLog();
      toast(et.type+' denemesi kaydedildi ✓');
    }
  }
  STATE.examTimer = {running:false, type:null, remaining:0, total:0, interval:null};
  renderStudy();
}

/* Study heatmap calendar: white (0 min) → dark green (240+ min) */
function renderStudyCalendar(){
  const cal = STATE._studyCal;
  const first = new Date(cal.y, cal.m, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(cal.y, cal.m+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const todayStr = todayISO();

  return `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <button class="icon-btn" onclick="shiftStudyMonth(-1)">←</button>
      <h3 style="margin:0;">${MONTH_NAMES[cal.m]} ${cal.y}</h3>
      <button class="icon-btn" onclick="shiftStudyMonth(1)">→</button>
    </div>
    <div class="week-grid" style="grid-template-columns:repeat(7,1fr);">
      ${DAYS.map(d=>`<div class="hdr">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(!d) return '<div></div>';
        const dateObj = new Date(cal.y, cal.m, d);
        const iso = dateObj.toISOString().slice(0,10);
        const mins = sumMinutes(l=>l.date===iso);
        const isToday = iso===todayStr;
        const light = mins>150;
        return `<div style="background:${heatColor(mins)}; ${isToday?'outline:2px solid var(--amber); outline-offset:-2px;':''} min-height:50px;" title="${mins} dk çalışıldı">
          <div class="mono" style="font-size:10.5px; font-weight:600; color:${light?'#fff':'var(--ink)'};">${d}</div>
          ${mins? `<div class="mono" style="font-size:9px; color:${light?'#fff':'var(--ink-soft)'};">${mins}dk</div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11px; color:var(--ink-soft);">
      Az
      <div style="width:14px;height:14px;border-radius:3px;background:${heatColor(0)};border:1px solid var(--line);"></div>
      <div style="width:14px;height:14px;border-radius:3px;background:${heatColor(45)};"></div>
      <div style="width:14px;height:14px;border-radius:3px;background:${heatColor(100)};"></div>
      <div style="width:14px;height:14px;border-radius:3px;background:${heatColor(180)};"></div>
      <div style="width:14px;height:14px;border-radius:3px;background:${heatColor(240)};"></div>
      Çok
    </div>`;
}
function shiftStudyMonth(delta){
  let m = STATE._studyCal.m + delta, y = STATE._studyCal.y;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  STATE._studyCal = {y,m};

function renderSettings(){
  document.getElementById('mainArea').innerHTML = `
    <div class="topline"><div><h1 class="page-title">Ayarlar</h1><div class="page-sub">Hesap bilgilerini güncelle.</div></div></div>
    <div class="card" style="max-width:460px;">
      <div class="field"><label>Adın</label><input id="st_name" value="${STATE.settings.name}"></div>
      <div class="field"><label>Hedefin</label>
        <select id="st_track">
          <option value="sayisal" ${STATE.settings.track==='sayisal'?'selected':''}>Sayısal</option>
          <option value="ea" ${STATE.settings.track==='ea'?'selected':''}>Eşit Ağırlık</option>
          <option value="sozel" ${STATE.settings.track==='sozel'?'selected':''}>Sözel</option>
        </select>
      </div>
      <div class="field"><label>YKS Tarihi</label>
        <div class="mono" style="padding:11px 13px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft);">${fmtDate(STATE.settings.examDate)} <span style="font-size:11.5px;">(her yıl 21 Haziran, sabit)</span></div>
      </div>
      <button class="btn btn-amber" onclick="saveSettingsForm()">Kaydet</button>
    </div>
  `;
}
async function saveSettingsForm(){
  STATE.settings.name = document.getElementById('st_name').value.trim() || STATE.settings.name;
  STATE.settings.track = document.getElementById('st_track').value;
  STATE.settings.examDate = getFixedExamDate();
  await saveSettings();
  document.getElementById('sideUserline').textContent = STATE.settings.name + ' · ' + trackLabel(STATE.settings.track);
  toast('Ayarlar kaydedildi ✓');
}

/* ---------------- INIT ---------------- */
(async function init(){
  if(!sb){
    document.getElementById('loginSubtitle').textContent = 'Sunucuya bağlanılamadı. İnternet bağlantını kontrol edip sayfayı yenile.';
    return;
  }
  const token = getSessionToken();
  if(token){
    try{
      const { data, error } = await sb.rpc('get_profile', { p_token: token });
      if(!error && data && data.length){
        STATE.sessionToken = token;
        STATE.user = data[0].username;
        await loadAllData();
        enterApp();
        return;
      }
    }catch(e){ /* invalid/expired session */ }
    clearSessionToken();
  }
})();
</script>
